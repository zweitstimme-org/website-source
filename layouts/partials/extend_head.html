{{- /* Cookie-less pageview ping. Counts zweitstimme.org and the GitHub Pages preview. */ -}}
<script>
(function () {
  var HOSTS = {
    "zweitstimme.org": 1,
    "www.zweitstimme.org": 1,
    "zweitstimme-org.github.io": 1
  };
  var ALLOW = ["id", "state", "land", "party", "name", "wkr", "bezirk"];
  var lastSent = "";
  var timer = null;

  function optedOut() {
    try {
      if (/[?&]nocount=1(?:&|$)/.test(location.search)) {
        localStorage.setItem("zweitstimme-nocount", "1");
      }
      if (/[?&]nocount=0(?:&|$)/.test(location.search)) {
        localStorage.removeItem("zweitstimme-nocount");
      }
      return localStorage.getItem("zweitstimme-nocount") === "1";
    } catch (e) {
      return false;
    }
  }

  function pageKey() {
    var path = location.pathname || "/";
    path = path.replace(/^\/website-pipeline(?=\/|$)/, "") || "/";
    var params = new URLSearchParams(location.search || "");
    var bits = [];
    for (var i = 0; i < ALLOW.length; i++) {
      var k = ALLOW[i];
      var v = params.get(k);
      if (v) bits.push(k + "=" + v);
    }
    var key = path;
    if (bits.length) key += "?" + bits.join("&");
    if (key.length > 200) key = key.slice(0, 200);
    return key;
  }

  function slug(s) {
    return String(s || "")
      .replace(/^#/, "")
      .replace(/[^A-Za-z0-9._~/-]+/g, "-")
      .replace(/^-+|-+$/g, "")
      .slice(0, 40);
  }

  function detailsName(d) {
    if (d.id) return d.id;
    if (d.getAttribute("data-wkr")) return "wkr/" + d.getAttribute("data-wkr");
    if (d.getAttribute("data-bez")) return "bez/" + d.getAttribute("data-bez");
    var sum = d.querySelector(":scope > summary") || d.querySelector("summary");
    var label = (sum && sum.textContent) || "item";
    if (d.hasAttribute("data-faq-item")) {
      return "faq/" + (d.getAttribute("data-section") || "all") + "/" + label;
    }
    var kind = "details";
    if (d.classList.contains("wb-coverage")) kind = "wb";
    else if (d.classList.contains("wb-cov-nest")) kind = "wb-nest";
    else if (d.classList.contains("wb-entry-party")) kind = "wb-party";
    else if (d.classList.contains("district-cand-info")) kind = "district-cand";
    else if (d.classList.contains("ce-explainer")) kind = "ce-explainer";
    else if (d.classList.contains("ce-cand-info")) kind = "ce-cand";
    return kind + "/" + label;
  }

  function clickKey(el) {
    var arm = el.closest(".state-arm");
    if (arm) {
      if (arm.classList.contains("load-more-button")) return "/click/load-more";
      if (arm.classList.contains("show-less-button")) return "/click/show-less";
      var section = "landtag";
      if (arm.closest("#vorhersage-targets")) section = "vorhersage";
      else if (arm.closest("#vorhersage-archive-targets")) section = "archiv";
      var st = arm.getAttribute("data-state") || arm.getAttribute("data-forecast-key");
      return st ? "/click/" + section + "/" + slug(st) : "/click/" + section;
    }
    var tab = el.closest(".district-preview-target, .ce-tab, [data-wb-land]");
    if (tab) {
      var code = tab.getAttribute("data-code") || tab.getAttribute("data-state") || tab.getAttribute("data-wb-land");
      var kind = tab.hasAttribute("data-wb-land") ? "wahlabend" : "tab";
      return "/click/" + kind + "/" + slug(code || "unknown");
    }
    var mehr = el.closest(".scenario-prob-toggle, .district-party-toggle");
    if (mehr) {
      var action = mehr.getAttribute("aria-expanded") === "true" ? "collapse" : "expand";
      var where = mehr.id ? slug(mehr.id) : "toggle";
      return "/click/" + action + "/" + where;
    }
    var cap = el.closest("#poll-table-caption-toggle, #state-poll-table-caption-toggle");
    if (cap) {
      var capAction = cap.getAttribute("aria-expanded") === "true" ? "collapse" : "expand";
      return "/click/" + capAction + "/" + slug(cap.id);
    }
    var jump = el.closest(".home-jump-btn");
    if (jump) return "/click/jump/" + slug(jump.getAttribute("href") || "jump");
    var sw = el.closest(".toggle-switch");
    if (sw) return "/click/toggle/" + slug(sw.id || "switch");
    var sum = el.closest("summary");
    if (sum) {
      var d = sum.closest("details");
      if (d) {
        // Capture runs before the default toggle, so invert current open state.
        var detAction = d.open ? "collapse" : "expand";
        return "/click/" + detAction + "/" + slug(detailsName(d));
      }
    }
    return null;
  }

  function viewport() {
    try {
      return window.matchMedia("(max-width: 768px)").matches ? "n" : "w";
    } catch (e) {
      return "w";
    }
  }

  function cellular() {
    try {
      var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (c && String(c.type || "").toLowerCase() === "cellular") return "c";
    } catch (e) {}
    return "";
  }

  function send(key) {
    var img = new Image();
    img.referrerPolicy = "no-referrer";
    var src = "https://polsci.uni-wh.de/zweitstimme.gif?p=" + encodeURIComponent(key) + "&v=" + viewport();
    var cell = cellular();
    if (cell) src += "&c=" + cell;
    img.src = src;
  }

  function ping() {
    var key = pageKey();
    if (key === lastSent) return;
    lastSent = key;
    send(key);
  }

  function schedulePing() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(ping, 400);
  }

  function wrapHistory(fn) {
    return function () {
      var ret = fn.apply(this, arguments);
      schedulePing();
      return ret;
    };
  }

  try {
    if (!HOSTS[location.hostname]) return;
    if (optedOut()) return;
    if (navigator.doNotTrack === "1" || navigator.globalPrivacyControl) return;
    history.pushState = wrapHistory(history.pushState);
    history.replaceState = wrapHistory(history.replaceState);
    window.addEventListener("popstate", schedulePing);
    document.addEventListener("click", function (ev) {
      var t = ev.target;
      if (!t || !t.closest) return;
      var key = clickKey(t);
      if (key) send(key);
    }, true);
    document.addEventListener("change", function (ev) {
      var t = ev.target;
      if (!t || t.tagName !== "SELECT") return;
      var val = slug(t.value || "empty");
      var selKey = null;
      if (t.id === "time-period-select") selKey = "/click/zeitraum/bundestag/" + val;
      else if (t.id === "state-time-period-select") selKey = "/click/zeitraum/land/" + val;
      else if (t.classList && t.classList.contains("ce-bezirk")) selKey = "/click/select/bezirk/" + val;
      else if (t.id) selKey = "/click/select/" + slug(t.id) + "/" + val;
      if (selKey) send(selKey);
    }, true);
    schedulePing();
  } catch (e) {}
})();
</script>
