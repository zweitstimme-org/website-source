{{- define "main" }}
<article class="post-single">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    {{- if .Description }}
    <div class="post-description">{{ .Description }}</div>
    {{- end }}
  </header>
  <div class="post-content" style="margin-top:1.25rem;">
    {{ partial "district_forecast_map.html" . }}
  </div>
</article>
{{- end }}
